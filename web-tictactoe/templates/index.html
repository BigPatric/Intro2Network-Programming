<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>TicTacToe Web</title>
    <script src="//cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <div id="auth" class="card">
        <h2>井字棋登入/註冊</h2>
        <input id="username" placeholder="帳號">
        <input id="password" type="password" placeholder="密碼">
        <div>
            <button onclick="login()">登入</button>
            <button onclick="register()">註冊</button>
        </div>
        <div id="auth_msg" style="color:red;margin-top:10px;"></div>
    </div>
    <div id="login" class="card" style="display:none;">
        <h2>歡迎，<span id="show_user"></span></h2>
        <button onclick="showLobby()">進入大廳</button>
    </div>
    <div id="lobby" class="card" style="display:none;">
        <h2>大廳 - 在線玩家</h2>
        <div id="player_list"></div>
        <div id="lobby_msg" style="color:green;margin-top:10px;"></div>
        <button onclick="logout()">登出</button>
    </div>
    <div id="game" class="card" style="display:none;">
        <div id="status"></div>
        <div id="board"></div>
    </div>
<script>
let socket = io();
let mySymbol, room, myTurn, board, username;
let onlinePlayers = [];

function login() {
    username = document.getElementById('username').value.trim();
    let password = document.getElementById('password').value.trim();
    if(!username || !password) {
        document.getElementById('auth_msg').innerText = '帳號與密碼不可為空';
        return;
    }
    socket.emit('login', {username, password});
}
function register() {
    username = document.getElementById('username').value.trim();
    let password = document.getElementById('password').value.trim();
    if(!username || !password) {
        document.getElementById('auth_msg').innerText = '帳號與密碼不可為空';
        return;
    }
    socket.emit('register', {username, password});
}
socket.on('login_result', data => {
    if(data.success) {
        document.getElementById('auth').style.display = 'none';
        document.getElementById('login').style.display = '';
        document.getElementById('show_user').innerText = username;
        document.getElementById('auth_msg').innerText = '';
    } else {
        document.getElementById('auth_msg').innerText = data.msg;
    }
});
socket.on('register_result', data => {
    if(data.success) {
        document.getElementById('auth_msg').style.color = 'green';
        document.getElementById('auth_msg').innerText = '註冊成功！請登入。';
    } else {
        document.getElementById('auth_msg').style.color = 'red';
        document.getElementById('auth_msg').innerText = data.msg;
    }
});

function showLobby() {
    document.getElementById('login').style.display = 'none';
    document.getElementById('lobby').style.display = '';
    document.getElementById('game').style.display = 'none';
    socket.emit('get_players');
}
function logout() {
    location.reload();
}

socket.on('player_list', data => {
    onlinePlayers = data.players;
    let html = '';
    for(let p of onlinePlayers) {
        if(p !== username) {
            html += `<div style="margin:8px 0;">${p} <button onclick="invite('${p}')">邀請對戰</button></div>`;
        }
    }
    document.getElementById('player_list').innerHTML = html || '暫無其他玩家在線';
});

function invite(target) {
    socket.emit('invite', {from: username, to: target});
    document.getElementById('lobby_msg').innerText = `已送出邀請給 ${target}`;
}

socket.on('invited', data => {
    if(confirm(`${data.from} 邀請你對戰，是否接受？`)) {
        socket.emit('accept_invite', {from: data.from, to: username});
    } else {
        socket.emit('decline_invite', {from: data.from, to: username});
    }
});

socket.on('invite_accepted', data => {
    startGame(data);
});
socket.on('invite_declined', data => {
    document.getElementById('lobby_msg').innerText = `${data.to} 拒絕了你的邀請`;
});

function startGame(data) {
    mySymbol = data.symbol;
    room = data.room;
    myTurn = (data.turn === mySymbol);
    board = data.board;
    document.getElementById('lobby').style.display = 'none';
    document.getElementById('game').style.display = '';
    updateStatus();
    drawBoard();
}

socket.on('waiting', () => {
    document.getElementById('status').innerText = '等待其他玩家加入...';
    document.getElementById('login').style.display = 'none';
    document.getElementById('game').style.display = '';
});

socket.on('start', (data) => {
    startGame(data);
});

socket.on('move', (data) => {
    board = data.board;
    myTurn = (data.turn === mySymbol);
    document.getElementById('cell'+data.idx).innerText = data.symbol;
    updateStatus();
});

socket.on('end', (data) => {
    board = data.board;
    drawBoard();
    let msg = '';
    if (data.winner === 'Draw') msg = '平手！';
    else if (data.winner === mySymbol) msg = '你贏了！';
    else msg = '你輸了！';
    document.getElementById('status').innerHTML = msg + 
        ' <button onclick="restart()">再玩一次</button> <button onclick="location.reload()">回大廳</button>';
    myTurn = false;
});

function drawBoard() {
    let html = '';
    for(let i=0;i<9;i++) {
        html += `<button id="cell${i}" onclick="move(${i})" style="width:60px;height:60px;font-size:2em;" ${board[i] ? 'disabled' : ''}>${board[i]||''}</button>`;
        if(i%3==2) html += '<br>';
    }
    document.getElementById('board').innerHTML = html;
}

function move(idx) {
    if (!myTurn || board[idx]) return;
    socket.emit('move', {room, idx, symbol: mySymbol});
}

function updateStatus() {
    if (myTurn)
        document.getElementById('status').innerText = '你的回合 (' + mySymbol + ')';
    else
        document.getElementById('status').innerText = '對手回合';
}

function restart() {
    socket.emit('restart', {room, symbol: mySymbol});
}
</script>
</body>
</html>
